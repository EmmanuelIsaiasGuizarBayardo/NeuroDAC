[project]
name = "neurodac"
version = "2.1.0"
description = "Demostrador Académico de Neuroingeniería: visualización de EEG en vivo y neurofeedback para divulgación."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

# Sin pines de version: uv.lock fija la resolucion exacta.
# scipy llega como dependencia de mne; no se declara aqui porque el proyecto
# no lo importa directamente.
dependencies = [
    "dash",
    "dash-bootstrap-components",
    "plotly",
    "mne",
    "numpy",
    "pandas",
    "pyserial",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neurodac"]

# ── ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# NPY: reglas especificas de NumPy. B: bugbear. I: orden de imports.
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
