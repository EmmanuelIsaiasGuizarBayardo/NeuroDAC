<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Jardín Mental</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1423; }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script src="engine.js"></script>
<script src="palette.js"></script>
<script src="escenarios.js"></script>
<script src="textos.js"></script>
<script src="jardin.js"></script>
<script>
/* Cascaron del navegador: la logica vive en jardin.js y corre tambien en Node.
   Aqui solo se conecta el bucle con el presentador y el puente. */
(function () {
  'use strict';
  var E = window.NDEngine;
  var juego = window.NDJardin.createGame();
  var cuadro = E.createFrame(juego.W, juego.H, 0);
  var lienzo = document.getElementById('lienzo');
  var pantalla = E.createPresenter(lienzo, juego.W, juego.H, juego.palette);

  var acercamiento = false;
  var rejilla = false;

  function aplicarTema(tema) {
    pantalla.setTheme(tema, juego.backdropIndex);
  }
  aplicarTema('dark');
  E.listen(aplicarTema);

  // Ancho logico segun el tamano real del lienzo: la pagina ajusta el alto a
  // un multiplo exacto y el juego dibuja tantas columnas como quepan.
  // Reasigna buffers solo cuando el ancho cambia, nunca en el bucle.
  function ajustarAncho() {
    var dpr = window.devicePixelRatio || 1;
    var r = E.fitWidth(
      Math.floor(lienzo.clientWidth * dpr),
      Math.floor(lienzo.clientHeight * dpr),
      juego.MIN_W, juego.MAX_W, juego.H
    );
    if (r.w !== juego.W) {
      juego.setWidth(r.w);
      cuadro = E.createFrame(juego.W, juego.H, 0);
      pantalla.setLogicalSize(juego.W, juego.H);
    }
  }
  window.addEventListener('resize', ajustarAncho);
  ajustarAncho();

  E.runLoop(
    function () { juego.tick(); },
    function () {
      juego.render(cuadro);
      // El acercamiento y la rejilla solo existen fuera de la aplicacion.
      if (juego.zoom !== acercamiento) {
        acercamiento = juego.zoom;
        if (acercamiento) {
          var r = juego.focus();
          pantalla.setView(r.x, r.y, r.w, r.h);
        } else {
          pantalla.setView();
        }
      }
      if (juego.grid !== rejilla) {
        rejilla = juego.grid;
        pantalla.setGrid(rejilla);
      }
      pantalla.present(cuadro);
    }
  );
})();
</script>
</body>
</html>
